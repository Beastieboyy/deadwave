// SFX ENGINE (Web Audio API — procedural, no files)

const SFX={ctx:null,sfxVol:0.6,musicVol:0.4,muted:false,musicMuted:false,
  init(){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  play(type){
    if(!this.ctx||this.muted)return;this.resume();
    const g=this.ctx.createGain();g.connect(this.ctx.destination);const now=this.ctx.currentTime;
    switch(type){
      case'shoot':{const o=this.ctx.createOscillator();o.connect(g);o.type='square';o.frequency.setValueAtTime(880,now);o.frequency.exponentialRampToValueAtTime(440,now+0.08);g.gain.setValueAtTime(this.sfxVol*0.3,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.08);o.start(now);o.stop(now+0.08);break;}
      case'hit':{const bs=this.ctx.sampleRate*0.05,buf=this.ctx.createBuffer(1,bs,this.ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<bs;i++)d[i]=(Math.random()*2-1)*(1-i/bs);const s=this.ctx.createBufferSource();s.buffer=buf;s.connect(g);g.gain.setValueAtTime(this.sfxVol*0.4,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.05);s.start(now);s.stop(now+0.05);break;}
      case'death':{const o=this.ctx.createOscillator();o.connect(g);o.type='sawtooth';o.frequency.setValueAtTime(400,now);o.frequency.exponentialRampToValueAtTime(50,now+0.4);g.gain.setValueAtTime(this.sfxVol*0.5,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.4);o.start(now);o.stop(now+0.4);break;}
      case'hurt':{const o=this.ctx.createOscillator();o.connect(g);o.type='sawtooth';o.frequency.setValueAtTime(150,now);o.frequency.exponentialRampToValueAtTime(80,now+0.15);g.gain.setValueAtTime(this.sfxVol*0.6,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.15);o.start(now);o.stop(now+0.15);break;}
      case'levelup':{[523,659,784,1047].forEach((f,i)=>{const o=this.ctx.createOscillator(),og=this.ctx.createGain();o.connect(og);og.connect(this.ctx.destination);o.type='square';o.frequency.value=f;const t=now+i*0.1;og.gain.setValueAtTime(0,t);og.gain.linearRampToValueAtTime(this.sfxVol*0.4,t+0.02);og.gain.exponentialRampToValueAtTime(0.001,t+0.15);o.start(t);o.stop(t+0.15);});break;}
      case'collect':{const o=this.ctx.createOscillator();o.connect(g);o.type='sine';o.frequency.setValueAtTime(880,now);o.frequency.exponentialRampToValueAtTime(1320,now+0.1);g.gain.setValueAtTime(this.sfxVol*0.3,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.1);o.start(now);o.stop(now+0.1);break;}
      case'whistle':{const o=this.ctx.createOscillator();o.connect(g);o.type='sine';o.frequency.setValueAtTime(2000,now);o.frequency.setValueAtTime(2400,now+0.05);o.frequency.setValueAtTime(2000,now+0.1);g.gain.setValueAtTime(this.sfxVol*0.5,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.2);o.start(now);o.stop(now+0.2);break;}
      case'boss':{[200,180,160,140].forEach((f,i)=>{const o=this.ctx.createOscillator(),og=this.ctx.createGain();o.connect(og);og.connect(this.ctx.destination);o.type='sawtooth';o.frequency.value=f;const t=now+i*0.15;og.gain.setValueAtTime(this.sfxVol*0.4,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.start(t);o.stop(t+0.2);});break;}
      case'roundclear':{[523,659,784,659,1047].forEach((f,i)=>{const o=this.ctx.createOscillator(),og=this.ctx.createGain();o.connect(og);og.connect(this.ctx.destination);o.type='square';o.frequency.value=f;const t=now+i*0.12;og.gain.setValueAtTime(this.sfxVol*0.5,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.18);o.start(t);o.stop(t+0.18);});break;}
      case'equip':{const o=this.ctx.createOscillator();o.connect(g);o.type='sine';[440,550,660].forEach((f,i)=>o.frequency.setValueAtTime(f,now+i*0.06));g.gain.setValueAtTime(this.sfxVol*0.4,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.25);o.start(now);o.stop(now+0.25);break;}
      case'pause':{const o=this.ctx.createOscillator();o.connect(g);o.type='sine';o.frequency.setValueAtTime(660,now);o.frequency.exponentialRampToValueAtTime(330,now+0.15);g.gain.setValueAtTime(this.sfxVol*0.3,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.15);o.start(now);o.stop(now+0.15);break;}
      case'legendary':{[440,554,659,880,1108,1319].forEach((f,i)=>{const o=this.ctx.createOscillator(),og=this.ctx.createGain();o.connect(og);og.connect(this.ctx.destination);o.type='square';o.frequency.value=f;const t=now+i*0.08;og.gain.setValueAtTime(this.sfxVol*0.5,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.start(t);o.stop(t+0.2);});break;}
    }
  },
  save(){localStorage.setItem('dtm_audio',JSON.stringify({sfxVol:this.sfxVol,musicVol:this.musicVol,muted:this.muted,musicMuted:this.musicMuted}));},
  load(){try{const d=JSON.parse(localStorage.getItem('dtm_audio')||'{}');this.sfxVol=d.sfxVol??0.6;this.musicVol=d.musicVol??0.4;this.muted=d.muted??false;this.musicMuted=d.musicMuted??false;}catch(e){}}
};

  getInventory:()=>JSON.parse(localStorage.getItem('dtm_gear_inv')||'[]'),

  _xget:async(url)=>{console.log('XHR:',url);return new Promise((resolve)=>{const xhr=new XMLHttpRequest();xhr.open('GET',url,true);xhr.timeout=8000;xhr.onload=()=>{try{const d=JSON.parse(xhr.responseText);console.log('XHR OK:',d);resolve(d);}catch(e){console.error('XHR parse:',e);resolve({error:'Invalid response'});}};xhr.onerror=()=>{console.error('XHR err');resolve({error:'Network error'});};xhr.ontimeout=()=>{console.error('XHR timeout');resolve({error:'Request timed out'});};xhr.send();});},
  locationForLevel:(n)=>{
    if(n<=10) return{name:'NORTHWOOD HIGH',color:'#4488ff'};
    if(n<=20) return{name:'MAIN ST ROASTERS',color:'#ff8800'};
    if(n<=30) return{name:'TIKI TAN',color:'#ff44aa'};
    if(n<=50) return{name:'THE STREETS',color:'#ffcc00'};
    return{name:"BRODY'S HOUSE",color:'#ff4444'};
  },
  enemiesForLevel:(n)=>{
    if(n<=10) return['ew','sister','ef','es','coach','et','boss'];
    if(n<=20) return['ew','sister','ef','es','coach','et','boss'];
    if(n<=30) return['ew','sister','ef','es','coach','et','boss'];
    return['ew','sister','ef','es','coach','et','boss'];
  },
  calcScore:(kills,rounds,timeLeft,stars,level)=>(kills*100)+(rounds*500)+(Math.floor(timeLeft/1000)*10)+(stars*1000)+(level*200),
  submitScore:async(score,level,kills,stars)=>{const n=DTM.getName(),p=DTM.getPin();if(!n||n.startsWith('Guest_'))return{error:'guest'};return DTM._xget(`${DTM.API}?action=submit&name=${encodeURIComponent(n)}&pin=${encodeURIComponent(p)}&score=${score}&level=${level}&kills=${kills}&stars=${stars}`);},
  fetchLeaderboard:async(period='all')=>DTM._xget(`${DTM.API}?action=leaderboard&period=${period}`),
  getPersonalBest:async()=>{const n=DTM.getName(),p=DTM.getPin();if(!n||n.startsWith('Guest_'))return null;return DTM._xget(`${DTM.API}?action=personal&name=${encodeURIComponent(n)}&pin=${encodeURIComponent(p)}`);},
  makeBG:(scene)=>{const g=scene.add.graphics();g.fillStyle(0x08080f);g.fillRect(0,0,W,H);g.lineStyle(1,0x1a1a2e,0.5);for(let x=0;x<W;x+=40)g.lineBetween(x,0,x,H);for(let y=0;y<H;y+=40)g.lineBetween(0,y,W,y);return g;},
  makeCard:(scene,x,y,w,h,alpha=1)=>{const g=scene.add.graphics();g.fillStyle(0x1a1a2e,alpha);g.fillRoundedRect(x,y,w,h,12);g.lineStyle(2,0xff9900,0.6);g.strokeRoundedRect(x,y,w,h,12);return g;},
  makeBtn:(scene,x,y,w,h,label,color=0xff9900)=>{
    const g=scene.add.graphics();g.fillStyle(color,1);g.fillRoundedRect(x,y,w,h,10);
    const t=scene.add.text(x+w/2,y+h/2,label,{fontFamily:'Orbitron',fontSize:'16px',color:'#000',fontStyle:'bold'}).setOrigin(0.5).setDepth(10);
    g.setInteractive(new Phaser.Geom.Rectangle(x,y,w,h),Phaser.Geom.Rectangle.Contains);
    g.on('pointerover',()=>g.setAlpha(0.8));g.on('pointerout',()=>g.setAlpha(1));
    return{bg:g,text:t};
  },
  bottomNav:(scene,active)=>{
    const tabs=[{key:'hub',icon:'\ud83c\udfe0',label:'HOME'},{key:'chapter',icon:'\u2b50',label:'NIGHTS'},{key:'leaderboard',icon:'\ud83c\udfc6',label:'RANKS'},{key:'upgrade',icon:'\ud83c\udf92',label:'LOCKER'}];
    const bg=scene.add.graphics().setDepth(99);bg.fillStyle(0x0d0d0d,0.97);bg.fillRect(0,H-80,W,80);bg.lineStyle(1,0xff9900,0.4);bg.lineBetween(0,H-80,W,H-80);
    tabs.forEach((tab,i)=>{
      const tx=i*(W/4)+W/8;const isA=tab.key===active;
      scene.add.text(tx,H-56,tab.icon,{fontSize:'22px'}).setOrigin(0.5).setDepth(100);
      scene.add.text(tx,H-30,tab.label,{fontFamily:'Orbitron',fontSize:'9px',color:isA?'#ff9900':'#666688'}).setOrigin(0.5).setDepth(100);
      if(isA){const ind=scene.add.graphics().setDepth(100);ind.fillStyle(0xff9900,1);ind.fillRect(tx-20,H-82,40,3);}
      const zone=scene.add.zone(tx,H-56,W/4,80).setDepth(101).setInteractive();
      zone.on('pointerdown',()=>{if(tab.key===active)return;scene.cameras.main.fadeOut(250,0,0,0);scene.time.delayedCall(250,()=>{const m={hub:'HubScene',chapter:'ChapterScene',leaderboard:'LeaderboardScene',upgrade:'UpgradeScene'};scene.scene.start(m[tab.key]);});});
    });
  }
};

      {key:'braden',sprite:'braden',name:'BRADEN',sub:'Just needs the content.',stats:{speed:160,hp:95,snacks:0},perk:'\ud83d\ude02 Enemies laugh = brief stun',pc:'#ff6600',color:0xff6600,vr:8,vs:'"DELETE THAT VIDEO RIGHT NOW"',vq:'BRO I GOT IT ALL ON CAMERA'},

      this.add.text(110,yPos+82,c.perk,{fontFamily:'Orbitron',fontSize:'10px',color:c.pc,fontStyle:'bold'}).setOrigin(0,0.5).setDepth(3);

      charTapTargets.push({y:yPos,h:cardH,char:c});
      yPos+=cardH+8;
    });
    // Scroll setup — camera-based with drag threshold
    const csTotalH=CHARS.length*(cardH+8)+75;
    const csVisTop=65,csVisBot=H;
    const csVisH=csVisBot-csVisTop;
    const csMaxScroll=Math.max(0,csTotalH-csVisH);
    let csScroll=0,csPointerDownY=0,csIsDragging=false;
    const CS_DRAG_THRESHOLD=10;
    if(csMaxScroll>0){const csListCam=this.cameras.add(0,csVisTop,W,csVisH);csListCam.setBackgroundColor(0x00000000);csListCam.scrollY=0;
    this.input.on('pointermove',p=>{if(!p.isDown)return;if(Math.abs(p.y-csPointerDownY)>CS_DRAG_THRESHOLD){csIsDragging=true;csScroll=Phaser.Math.Clamp(csScroll+(csPointerDownY-p.y),0,csMaxScroll);csListCam.scrollY=csScroll;csPointerDownY=p.y;}});}
    this.input.on('pointerdown',p=>{csPointerDownY=p.y;csIsDragging=false;});
    this.input.on('pointerup',p=>{if(csIsDragging){csIsDragging=false;return;}const adjustedY=p.y-csVisTop+csScroll;charTapTargets.forEach(t=>{if(adjustedY>=t.y&&adjustedY<=t.y+t.h){localStorage.setItem('dtm_character',JSON.stringify(t.char));this.cameras.main.flash(300,(t.char.color>>16)&255,(t.char.color>>8)&255,t.char.color&255);this.cameras.main.fadeOut(300,0,0,0);this.time.delayedCall(300,()=>this.scene.start('HubScene'));}});csIsDragging=false;});
    this.cameras.main.fadeIn(400,0,0,0);
  }
}

class ChapterScene extends Phaser.Scene {
  constructor(){super('ChapterScene');}
  create(){
    try{const n=(DTM.getName()||'').toLowerCase().trim(),p=(localStorage.getItem('dtm_pin')||'').trim();if(n==='vince'&&p==='8675')localStorage.setItem('dtm_unlocked',JSON.stringify(ROSTER.map((_,i)=>i)));}catch(e){}
    DTM.makeBG(this);
    const hg=this.add.graphics();hg.fillStyle(0x0d0d0d,0.97);hg.fillRect(0,0,W,65);hg.lineStyle(2,0xff9900,0.4);hg.lineBetween(0,65,W,65);
    this.add.text(W/2,22,'\ud83d\udc3e CHOOSE YOUR OPPONENT',{fontFamily:'Orbitron',fontSize:'15px',color:'#ff9900',fontStyle:'bold'}).setOrigin(0.5);
    this.add.text(W/2,46,'Who are you sneaking past tonight?',{fontFamily:'Orbitron',fontSize:'10px',color:'#888899'}).setOrigin(0.5);
    const back=this.add.text(16,33,'\u2039 BACK',{fontFamily:'Orbitron',fontSize:'13px',color:'#888899'}).setOrigin(0,0.5).setInteractive({useHandCursor:true});
    back.on('pointerdown',()=>{this.cameras.main.fadeOut(250,0,0,0);this.time.delayedCall(250,()=>this.scene.start('HubScene'));});
    const unlocked=JSON.parse(localStorage.getItem('dtm_unlocked')||'[0]');
    const bestScores=JSON.parse(localStorage.getItem('dtm_best_scores')||'{}');
    const foundKrypto=JSON.parse(localStorage.getItem('dtm_kryptonite_found')||'{}');
    const cardW=W-32,cardH=80;
    const tapTargets=[];
    let yPos=75;
    ROSTER.forEach((char,idx)=>{
      const isUnlocked=unlocked.includes(idx);
      const best=bestScores[char.key]||0;
      const hasKrypto=foundKrypto[char.key]||false;
      const colHex='#'+char.color.toString(16).padStart(6,'0');
      const card=this.add.graphics().setDepth(2);
      card.fillStyle(isUnlocked?0x1a1a2e:0x0a0a0a,0.97);
      card.fillRoundedRect(16,yPos,cardW,cardH,8);
      card.lineStyle(isUnlocked?2:1,isUnlocked?char.color:0x1a1a1a,isUnlocked?0.7:0.3);
      card.strokeRoundedRect(16,yPos,cardW,cardH,8);
      if(isUnlocked){
        this.add.text(38,yPos+cardH/2,char.icon,{fontSize:'28px'}).setOrigin(0.5).setDepth(3);
        this.add.text(68,yPos+20,char.name,{fontFamily:'Orbitron',fontSize:'14px',color:colHex,fontStyle:'bold'}).setOrigin(0,0.5).setDepth(3);
        this.add.text(68,yPos+40,char.sub,{fontFamily:'Orbitron',fontSize:'9px',color:'#888899',fontStyle:'italic',wordWrap:{width:cardW-160}}).setOrigin(0,0.5).setDepth(3);
        const stars='\u2605'.repeat(char.difficulty)+'\u2606'.repeat(5-char.difficulty);
        this.add.text(68,yPos+60,stars,{fontSize:'12px',color:'#ff9900'}).setOrigin(0,0.5).setDepth(3);
        this.add.text(cardW-4,yPos+20,hasKrypto?char.kryptonite.icon+' KNOWN':'\ud83d\udd12 KRYPTONITE',{fontFamily:'Orbitron',fontSize:'9px',color:hasKrypto?'#00ff88':'#555577'}).setOrigin(1,0.5).setDepth(3);
        if(best>0)this.add.text(cardW-4,yPos+40,'BEST: '+best.toLocaleString(),{fontFamily:'Orbitron',fontSize:'9px',color:'#888899'}).setOrigin(1,0.5).setDepth(3);
        if(char.isBoss)this.add.text(cardW-4,yPos+60,'\ud83d\udc51 BOSS',{fontFamily:'Orbitron',fontSize:'10px',color:'#ff6600',fontStyle:'bold'}).setOrigin(1,0.5).setDepth(3);
        tapTargets.push({y:yPos,h:cardH,char,idx});
      }else{
        this.add.text(38,yPos+cardH/2,'\ud83d\udd12',{fontSize:'22px'}).setOrigin(0.5).setDepth(3);
        this.add.text(68,yPos+cardH/2,idx===0?'Play to unlock!':'Beat '+ROSTER[idx-1].name+' to unlock',{fontFamily:'Orbitron',fontSize:'11px',color:'#333344'}).setOrigin(0,0.5).setDepth(3);
      }
      yPos+=cardH+6;
    });
    // Scroll setup — camera-based with drag threshold
    const totalH=ROSTER.length*(cardH+6)+75;
    const visibleTop=65,visibleBot=H-80;
    const visH=visibleBot-visibleTop;
    const maxScroll=Math.max(0,totalH-visH);
    let scroll=0,pointerDownY=0,isDragging=false;
    const DRAG_THRESHOLD=10;
    const listCam=this.cameras.add(0,visibleTop,W,visH);
    listCam.setBackgroundColor(0x00000000);
    listCam.scrollY=0;
    this.input.on('pointerdown',p=>{pointerDownY=p.y;isDragging=false;});
    this.input.on('pointermove',p=>{if(!p.isDown)return;if(Math.abs(p.y-pointerDownY)>DRAG_THRESHOLD){isDragging=true;scroll=Phaser.Math.Clamp(scroll+(pointerDownY-p.y),0,maxScroll);listCam.scrollY=scroll;pointerDownY=p.y;}});
    this.input.on('pointerup',p=>{if(isDragging){isDragging=false;return;}const adjustedY=p.y-visibleTop+scroll;tapTargets.forEach(t=>{if(adjustedY>=t.y&&adjustedY<=t.y+t.h){localStorage.setItem('dtm_opponent',JSON.stringify(t.char));DTM.setCurrentLevel(t.idx);this.cameras.main.fadeOut(250,0,0,0);this.time.delayedCall(250,()=>this.scene.start('HubScene'));}});isDragging=false;});
    if(maxScroll>0){
      const sbH=Math.max(40,(visH/totalH)*visH);
      const sbTrack=this.add.graphics().setDepth(20).setScrollFactor(0);
      sbTrack.fillStyle(0x222233,0.8);sbTrack.fillRoundedRect(W-8,visibleTop,5,visH,3);
      const sbThumb=this.add.graphics().setDepth(21).setScrollFactor(0);
      this.time.addEvent({delay:16,loop:true,callback:()=>{if(!sbThumb.scene)return;const pct=maxScroll>0?scroll/maxScroll:0;const sbY=visibleTop+pct*(visH-sbH);sbThumb.clear();sbThumb.fillStyle(0xff9900,0.9);sbThumb.fillRoundedRect(W-8,sbY,5,sbH,3);}});
    }
    DTM.bottomNav(this,'chapter');this.cameras.main.fadeIn(350,0,0,0);
  }
}

  startRound(n){
    if(this.dead)return;
    const rd0=this.activeRounds[n-1];
    if(!rd0){this.winGame();return;}
    if(n===1&&this.opponent){
      this.showIntroCutscene(this.opponent,()=>this.doStartRound(n));
    }else{
      this.doStartRound(n);
    }
  }

  doStartRound(n){
    this.roundNum=n;this.roundActive=true;this.roundEnemies=[];this.roundEnemiesExpected=0;
    let rd=this.activeRounds[n-1];
    if(!rd){this.winGame();return;}
    // Villain swap: if playing as friend, Brody replaces that friend's round
    const vc=this.selectedChar;
    if(vc&&vc.vr!==null&&vc.vr!==undefined&&(n-1)===vc.vr){rd={...rd,label:'BRODY FOUND OUT',sub:vc.vs||'"..."',story:'Wait... is that BRODY??\nHe looks angry.',enemies:[{type:'brody_villain',count:1}],speech:{brody_villain:vc.vs||'"..."'},deathQ:{brody_villain:vc.vq||'This isn\'t over!!'}};}
    this.currentRound=rd;
    this.roundTxt.setText(`ROUND ${n}/${this.activeRounds.length}`);
    const mainEnemy=rd.enemies[0].type;
    if(mainEnemy==='boss'){SFX.play('boss');DTM.MUSIC.play('boss');}else if(mainEnemy==='sister')SFX.play('boss');
    this.roundStartTime=this.elapsed;this.roundMinTimeMet=false;this._respawnScheduled=false;
    this.waveTxt.setText(rd.label).setAlpha(1).setY(H/2-80);
    this.tweens.add({targets:this.waveTxt,alpha:0,y:H/2-130,duration:2500,ease:'Power2'});
    let idx=0;let total=0;
    rd.enemies.forEach(grp=>{total+=grp.count;});
    this.roundEnemiesExpected=total;
    rd.enemies.forEach(grp=>{for(let i=0;i<grp.count;i++){this.time.delayedCall(idx*1500,()=>{if(this.dead)return;const e=this.spawnEnemy(grp.type);if(e)this.roundEnemies.push(e);});idx++;}});
  }

  checkRoundClear(){
    if(!this.roundActive||this.dead||this.transitioning)return;
    if(this.roundEnemiesExpected<=0||this.roundEnemies.length<this.roundEnemiesExpected)return;
    const alive=this.roundEnemies.filter(e=>e&&e.active&&!e.dead);
    if(alive.length>0)return;
    // Round complete
    this.transitioning=true;this.roundActive=false;this.roundsCompleted++;
    SFX.play('roundclear');
    this.cameras.main.flash(300,255,255,255);
    // Drop snacks
    const lk=this._lastKillPos||{x:W/2,y:H/2};
    for(let i=0;i<6;i++){const gx=lk.x+Phaser.Math.Between(-40,40),gy=lk.y+Phaser.Math.Between(-40,40);const gem=this.gems.create(gx,gy,'gem').setDepth(5).setDisplaySize(20,20);gem.xp=2;this.tweens.add({targets:gem,y:gy-22,duration:220,yoyo:true,ease:'Bounce'});}
    const ct=this.add.text(W/2,H/2,'\u2713 ROUND CLEAR!',{fontFamily:'Orbitron',fontSize:'26px',color:'#00ff88',fontStyle:'bold',stroke:'#000',strokeThickness:6}).setDepth(201).setOrigin(0.5).setAlpha(0);
    this.tweens.add({targets:ct,alpha:1,duration:300});
    this.time.delayedCall(2500,()=>{
      if(ct.scene)this.tweens.add({targets:ct,alpha:0,duration:300,onComplete:()=>{if(ct.scene)ct.destroy();}});
      if(this.roundNum>=this.activeRounds.length){this.winGame();return;}
      this.time.delayedCall(500,()=>{this.transitioning=false;this.startRound(this.roundNum+1);});
    });
  }

  randEdge(){const s=Phaser.Math.Between(0,3);switch(s){case 0:return{x:Phaser.Math.Between(0,W),y:-40};case 1:return{x:W+40,y:Phaser.Math.Between(0,H)};case 2:return{x:Phaser.Math.Between(0,W),y:H+40};case 3:return{x:-40,y:Phaser.Math.Between(0,H)};}}

      case 'et':e.setDisplaySize(100,100);e.setBodySize(36,36);e.hp=Math.floor(1200*hm);e.spd=28;e.dmg=20;e.gd=6;e.sv=150;e.burstColor=0xff0000;e.chargeDmg=30;break;
      case 'coach':e.setDisplaySize(90,90);e.setBodySize(32,32);e.play('coach_run');e.hp=Math.floor(800*hm);e.spd=70;e.dmg=14;e.gd=5;e.sv=120;e.burstColor=0x4488ff;e.lastWhistle=0;e.lastDrill=0;break;

        e.gd=6;e.sv=200;e.burstColor=0xcc44ff;break;

        this.bossOrbs=[0xff9900,0xff4400,0xff2244,0xffdd00].map(c=>{const o=this.add.graphics().setDepth(7);o.fillStyle(c,0.85);o.fillCircle(0,0,6);o.bossRef=e;return o;});break;
      case 'waylon':e.setDisplaySize(90,90);e.setBodySize(32,32);e.hp=Math.floor(500*hm);e.spd=80;e.dmg=12;e.gd=3;e.sv=80;e.burstColor=0x0044ff;if(this.anims.exists('waylon_run'))e.play('waylon_run');e.waylonCD=0;break;
      case 'jack':e.setDisplaySize(90,90);e.setBodySize(32,32);e.hp=Math.floor(450*hm);e.spd=42;e.dmg=10;e.gd=3;e.sv=90;e.burstColor=0x00aa44;if(this.anims.exists('jack_walk'))e.play('jack_walk');e.jackCD=0;e.jackStealCD=0;break;
      case 'joey':e.setDisplaySize(90,90);e.setBodySize(32,32);e.hp=Math.floor(380*hm);e.spd=110;e.dmg=8;e.gd=2;e.sv=70;e.burstColor=0x4444ff;if(this.anims.exists('joey_run'))e.play('joey_run');e.joeyCD=0;e.joeyBurst=false;break;
      case 'braden':e.setDisplaySize(90,90);e.setBodySize(32,32);e.hp=Math.floor(600*hm);e.spd=75;e.dmg=14;e.gd=5;e.sv=200;e.burstColor=0xff6600;if(this.anims.exists('braden_film'))e.play('braden_film');e.bradenLiveCD=0;e.bradenSpawnCD=0;e.bradenLaughCD=0;break;

    if(!seen.includes(tex)&&!e.isMinion){e.hp=Math.floor(e.hp*0.7);e.maxHp=e.hp;seen.push(tex);localStorage.setItem('dtm_seen',JSON.stringify(seen));this.time.delayedCall(500,()=>this.showNewEnemyIntro(tex));}

  spawnMinion(tex,size,hp){
    const{x,y}=this.randEdge();const e=this.enemies.create(x,y,tex).setDepth(6);
    e.uid=++this.uidCounter;e.dead=false;e.invincible=false;e.etype=tex;

    e.abilityTimer=0;e.abilityTimer2=0;e.abilityTimer3=0;e.spawnedMinions=0;e.patrolTarget=null;
    e.setDisplaySize(size,size);if(tex==='ef')e.play('karen_walk');

  update(time,delta){
    // Ghost-pause recovery
    if(this.paused&&!this.levelUpActive&&!this.dead&&!this.transitioning){console.warn('Ghost pause — recovering');this.paused=false;this.physics.resume();}
    if(this.paused||this.dead)return;
    // Joey player cramp
    if(this.isJoey&&!this.joeyCramped){const now2=this.time.now;if(now2-(this.joeyPlayerCrampCD||0)>30000){this.joeyPlayerCrampCD=now2;this.joeyCramped=true;const os=this.pSpeed;this.pSpeed=0;this.floatText(this.player.x,this.player.y-40,'\ud83d\ude23 CRAMP!!',0x4444ff);this.time.delayedCall(2000,()=>{this.pSpeed=os;this.joeyCramped=false;this.floatText(this.player.x,this.player.y-40,"ok I'm good",0x4444ff);});}}
    // Peyton player invincibility perk
    if(this.isPeytonPlayer&&!this.peytonInvinc){const now3=this.time.now;if(now3-(this.peytonInvincTimer||0)>15000){this.peytonInvincTimer=now3;this.peytonInvinc=true;this.player.setTint(0xcc44ff);this.floatText(this.player.x,this.player.y-40,'\ud83d\udc9c INVINCIBLE!',0xcc44ff);this.time.delayedCall(2000,()=>{this.peytonInvinc=false;this.player.clearTint();});}}
    this.elapsed+=delta;
    const rem=Math.max(0,this.totalTime-this.elapsed);
    const m=Math.floor(rem/60000),s=Math.floor((rem%60000)/1000);
    this.timerTxt.setText(`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`);
    if(rem<60000){this.timerTxt.setColor('#ff4444');if(rem<30000&&!this.timerUrgent){this.timerUrgent=true;this.tweens.add({targets:this.timerTxt,scaleX:1.2,scaleY:1.2,duration:300,yoyo:true,repeat:-1});}}else{this.timerTxt.setColor('#ffffff');}
    if(rem<=0){this.winGame();return;}
    if(this.playerIframes>0)this.playerIframes-=delta;
    this.playerLabel.setPosition(this.player.x,this.player.y-this.player.displayHeight/2-8);
    // Minimum round timer
    if(this.roundActive&&this.roundStartTime>0){
      const rElapsed=this.elapsed-this.roundStartTime;
      if(rElapsed<BALANCE.minRoundTime)this.roundMinTimeMet=false;else this.roundMinTimeMet=true;
      // In-round difficulty ramp
      if(rElapsed>=15000&&rElapsed<15000+delta)this.enemies.getChildren().forEach(en=>{if(!en.dead&&!en.isMinion){en.spd=Math.floor(en.spd*1.2);}});
      if(rElapsed>=30000&&rElapsed<30000+delta){this.enemies.getChildren().forEach(en=>{if(!en.dead&&!en.isMinion){en.spd=Math.floor(en.spd*1.15);}});this.floatText(W/2,H/2-40,"THEY'RE GETTING IMPATIENT...",0xff6600);}
    }
    // Enemy HP regen (2% max per second)
    // Enemy HP regen removed — enemies never heal
    if(this.playerFrozen){this.player.setVelocity(0,0);}else if(this.forcedRun){}else{this.movePlayer();}
    this.autoShoot(time);
    if(this.orbitCnt>0)this.updateOrbits(delta);
    this.updateEnemyAI(time,delta);
    this.updateProjectiles(delta);
    this.updateBossOrbs(delta);
    this.updateGlow();
    this.cleanBullets();
    if(!this.transitioning)this.checkRoundClear();
    // Combo decay after 3s
    if(this.comboCount>0&&this.time.now-this.lastComboTime>3000){this.comboCount=0;this.scoreMult=1;}
    this.multTxt.setText(this.scoreMult>1?`x${this.scoreMult}`:'');
    // Low HP vignette
    if(!this.vigGfx)this.vigGfx=this.add.graphics().setDepth(95);
    this.vigGfx.clear();
    if(this.pHP/this.pMaxHP<0.3){const pulse=0.12+0.08*Math.sin(this.time.now*0.006);this.vigGfx.fillStyle(0xff0000,pulse);this.vigGfx.fillRect(0,0,W,20);this.vigGfx.fillRect(0,H-20,W,20);this.vigGfx.fillRect(0,0,20,H);this.vigGfx.fillRect(W-20,0,20,H);}
    this.checkCollisions();
  }

  movePlayer(){
    let vx=0,vy=0;
    if(this.cursors.left.isDown||this.wasd.A.isDown)vx=-1;
    if(this.cursors.right.isDown||this.wasd.D.isDown)vx=1;
    if(this.cursors.up.isDown||this.wasd.W.isDown)vy=-1;
    if(this.cursors.down.isDown||this.wasd.S.isDown)vy=1;
    if(this.joyActive&&this.joyDist>0.1){vx=Math.cos(this.joyAng)*this.joyDist;vy=Math.sin(this.joyAng)*this.joyDist;}
    if(vx&&vy){vx*=0.707;vy*=0.707;}
    this.player.setVelocity(vx*this.pSpeed,vy*this.pSpeed);
    if(vx>0)this.player.setAngle(12);else if(vx<0)this.player.setAngle(-12);else this.player.setAngle(0);
  }

  autoShoot(time){
    if(time-this.lastShot<this.fireRate)return;const t=this.nearestEnemy();if(!t)return;this.lastShot=time;
    const b=this.bullets.create(this.player.x,this.player.y,'bullet').setDepth(8).setDisplaySize(28,12).setFlipX(true);
    b.pdmg=this.pDmg;b.pierce=this.piercing?3:1;b.hits=0;b.hitSet=new Set();
    const ang=Phaser.Math.Angle.Between(this.player.x,this.player.y,t.x,t.y);

  checkCollisions(){
    if(this.paused||this.dead)return;
    const bullets=this.bullets.getChildren(),enemies=this.enemies.getChildren();
    // Bullet vs enemy — manual distance check, runs exactly once per pair
    for(let bi=bullets.length-1;bi>=0;bi--){
      const b=bullets[bi];if(!b||!b.active)continue;if(!b.hitSet)b.hitSet=new Set();
      for(let ei=enemies.length-1;ei>=0;ei--){
        const e=enemies[ei];if(!e||e.dead||!e.active||e.invincible)continue;
        if(b.hitSet.has(e.uid))continue;
        const dx=b.x-e.x,dy=b.y-e.y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<(e.displayWidth/2)+6){
          b.hitSet.add(e.uid);
          e.hp-=this.pDmg;SFX.play('hit');
          console.log(`HIT on ${e.etype}: dealt ${this.pDmg}, HP now ${Math.ceil(e.hp)}/${e.maxHp}`);
          this.dmgNum(e.x,e.y-20,this.pDmg,'normal');
          e.setTint(0xffffff);this.time.delayedCall(80,()=>{if(e?.active&&!e.dead)e.clearTint();});
          if(e.hpGfx){e.hpGfx.setAlpha(0.4);this.time.delayedCall(120,()=>{if(e?.hpGfx)e.hpGfx.setAlpha(1);});}
          this.spawnHitParticles(e.x,e.y,e.burstColor||0xffff00);
          this.cameras.main.shake(60,0.004);
          b.hits=(b.hits||0)+1;
          if(e.hp<=0&&!e.dead)this.killEnemy(e);
          if(b.hits>=(b.pierce||1)){b.destroy();break;}
        }
      }
    }
    // Player vs enemy — contact damage with 600ms cooldown
    const now=this.time.now;
    if(now-this.lastHurtTime>=600){
      for(let ei=0;ei<enemies.length;ei++){
        const e=enemies[ei];if(!e||e.dead||!e.active)continue;
        const dx=this.player.x-e.x,dy=this.player.y-e.y;
        if(Math.sqrt(dx*dx+dy*dy)<(e.displayWidth/2)+16){
          this.lastHurtTime=now;this.hurtPlayer(e.dmg||8);break;
        }
      }
    }
    // Kryptonite pickup
    if(this.kryptoniteItem&&!this.kryptoUsed){const ki=this.kryptoniteItem;const kx=this.player.x-ki.x,ky=this.player.y-ki.y;if(Math.sqrt(kx*kx+ky*ky)<30)this.useKryptonite();}
    // Braden phone pickup
    if(this.bradenPhone){const bp=this.bradenPhone;const dx2=this.player.x-bp.x,dy2=this.player.y-bp.y;if(Math.sqrt(dx2*dx2+dy2*dy2)<35){bp.pickup();}}
    // Ground gear auto-pickup
    (this.groundGear||[]).forEach(item=>{if(!item.bg?.scene||item.collected)return;const dx=this.player.x-item.x,dy=this.player.y-item.y;if(Math.sqrt(dx*dx+dy*dy)<35)this.pickupGear(item);});
    // Gem pickup — distance check
    const gems=this.gems.getChildren();
    for(let gi=gems.length-1;gi>=0;gi--){
      const g=gems[gi];if(!g||!g.active)continue;
      const dx=this.player.x-g.x,dy=this.player.y-g.y;
      if(Math.sqrt(dx*dx+dy*dy)<24)this.pickGem(g);
    }
  }

    else{rankTxt.setText('\u23f3 Submitting score...');const result=await DTM.submitScore(score,level,kills,stars);if(result?.rank)rankTxt.setText(`\ud83c\udfc6 YOUR RANK: #${result.rank} on the Snitch List!`).setColor('#ffcc00');else rankTxt.setText('\ud83d\udce1 Score saved locally').setColor('#888899');}
    if(gearRewards.length>0){this.add.text(W/2,428,'\ud83c\udf81 GEAR EARNED:',{fontFamily:'Orbitron',fontSize:'12px',color:'#ffcc00'}).setOrigin(0.5);gearRewards.forEach((gi,i)=>{const rar=RARITIES[gi.rarityIdx];const col='#'+rar.color.toString(16).padStart(6,'0');const def=GEAR_DEFS[gi.slot];this.add.text(W/2,450+i*20,`${def.icon} ${gi.name}`,{fontFamily:'Orbitron',fontSize:'11px',color:col}).setOrigin(0.5);});}
    const retryBtn=DTM.makeBtn(this,20,510,(W-52)/2,56,'\u21ba RETRY');
    retryBtn.bg.on('pointerdown',()=>{this.cameras.main.fadeOut(250,0,0,0);this.time.delayedCall(250,()=>this.scene.start('GameScene',{level:level}));});
    const hubBtn=DTM.makeBtn(this,W/2+6,510,(W-52)/2,56,'\ud83c\udfe0 HOME',0x1a1a2e);
    hubBtn.text.setColor('#ff9900');hubBtn.bg.on('pointerdown',()=>{this.cameras.main.fadeOut(250,0,0,0);this.time.delayedCall(250,()=>this.scene.start('HubScene'));});
    if(win){const nextBtn=DTM.makeBtn(this,20,578,W-40,52,`NEXT NIGHT ${level+1} \u203a`,0x00aa44);nextBtn.bg.on('pointerdown',()=>{DTM.setCurrentLevel(level+1);this.cameras.main.fadeOut(250,0,0,0);this.time.delayedCall(250,()=>this.scene.start('GameScene',{level:level+1}));});}
    if(!win){const lc=parseInt(localStorage.getItem(`dtm_losses_${level}`)||'0');if(lc>=1)this.add.text(W/2,580,'\ud83d\udca1 Tip: Upgrade your gear\nin the Locker!',{fontFamily:'Orbitron',fontSize:'11px',color:'#888899',align:'center'}).setOrigin(0.5);if(lc>=2)this.add.text(W/2,616,'\ud83d\udcaa Comeback buff active next try!',{fontFamily:'Orbitron',fontSize:'10px',color:'#00ff88'}).setOrigin(0.5);}
    this.cameras.main.fadeIn(400,0,0,0);
  }
}

    scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH,width:W,height:H,expandParent:true},
    parent:document.body,
});
