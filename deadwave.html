// ─────────────────────────────────────────────────
// SFX ENGINE (Web Audio API — procedural, no files)
// ─────────────────────────────────────────────────
const SFX={ctx:null,sfxVol:0.6,musicVol:0.4,muted:false,musicMuted:false,
  init(){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  play(type){
    if(!this.ctx||this.muted)return;this.resume();
    const g=this.ctx.createGain();g.connect(this.ctx.destination);const now=this.ctx.currentTime;
    switch(type){
      case'shoot':{const o=this.ctx.createOscillator();o.connect(g);o.type='square';o.frequency.setValueAtTime(880,now);o.frequency.exponentialRampToValueAtTime(440,now+0.08);g.gain.setValueAtTime(this.sfxVol*0.3,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.08);o.start(now);o.stop(now+0.08);break;}
      case'hit':{const bs=this.ctx.sampleRate*0.05,buf=this.ctx.createBuffer(1,bs,this.ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<bs;i++)d[i]=(Math.random()*2-1)*(1-i/bs);const s=this.ctx.createBufferSource();s.buffer=buf;s.connect(g);g.gain.setValueAtTime(this.sfxVol*0.4,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.05);s.start(now);s.stop(now+0.05);break;}
      case'death':{const o=this.ctx.createOscillator();o.connect(g);o.type='sawtooth';o.frequency.setValueAtTime(400,now);o.frequency.exponentialRampToValueAtTime(50,now+0.4);g.gain.setValueAtTime(this.sfxVol*0.5,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.4);o.start(now);o.stop(now+0.4);break;}
      case'hurt':{const o=this.ctx.createOscillator();o.connect(g);o.type='sawtooth';o.frequency.setValueAtTime(150,now);o.frequency.exponentialRampToValueAtTime(80,now+0.15);g.gain.setValueAtTime(this.sfxVol*0.6,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.15);o.start(now);o.stop(now+0.15);break;}
      case'levelup':{[523,659,784,1047].forEach((f,i)=>{const o=this.ctx.createOscillator(),og=this.ctx.createGain();o.connect(og);og.connect(this.ctx.destination);o.type='square';o.frequency.value=f;const t=now+i*0.1;og.gain.setValueAtTime(0,t);og.gain.linearRampToValueAtTime(this.sfxVol*0.4,t+0.02);og.gain.exponentialRampToValueAtTime(0.001,t+0.15);o.start(t);o.stop(t+0.15);});break;}
      case'collect':{const o=this.ctx.createOscillator();o.connect(g);o.type='sine';o.frequency.setValueAtTime(880,now);o.frequency.exponentialRampToValueAtTime(1320,now+0.1);g.gain.setValueAtTime(this.sfxVol*0.3,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.1);o.start(now);o.stop(now+0.1);break;}
      case'whistle':{const o=this.ctx.createOscillator();o.connect(g);o.type='sine';o.frequency.setValueAtTime(2000,now);o.frequency.setValueAtTime(2400,now+0.05);o.frequency.setValueAtTime(2000,now+0.1);g.gain.setValueAtTime(this.sfxVol*0.5,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.2);o.start(now);o.stop(now+0.2);break;}
      case'boss':{[200,180,160,140].forEach((f,i)=>{const o=this.ctx.createOscillator(),og=this.ctx.createGain();o.connect(og);og.connect(this.ctx.destination);o.type='sawtooth';o.frequency.value=f;const t=now+i*0.15;og.gain.setValueAtTime(this.sfxVol*0.4,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.start(t);o.stop(t+0.2);});break;}
      case'roundclear':{[523,659,784,659,1047].forEach((f,i)=>{const o=this.ctx.createOscillator(),og=this.ctx.createGain();o.connect(og);og.connect(this.ctx.destination);o.type='square';o.frequency.value=f;const t=now+i*0.12;og.gain.setValueAtTime(this.sfxVol*0.5,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.18);o.start(t);o.stop(t+0.18);});break;}
      case'equip':{const o=this.ctx.createOscillator();o.connect(g);o.type='sine';[440,550,660].forEach((f,i)=>o.frequency.setValueAtTime(f,now+i*0.06));g.gain.setValueAtTime(this.sfxVol*0.4,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.25);o.start(now);o.stop(now+0.25);break;}
      case'pause':{const o=this.ctx.createOscillator();o.connect(g);o.type='sine';o.frequency.setValueAtTime(660,now);o.frequency.exponentialRampToValueAtTime(330,now+0.15);g.gain.setValueAtTime(this.sfxVol*0.3,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.15);o.start(now);o.stop(now+0.15);break;}
      case'legendary':{[440,554,659,880,1108,1319].forEach((f,i)=>{const o=this.ctx.createOscillator(),og=this.ctx.createGain();o.connect(og);og.connect(this.ctx.destination);o.type='square';o.frequency.value=f;const t=now+i*0.08;og.gain.setValueAtTime(this.sfxVol*0.5,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.start(t);o.stop(t+0.2);});break;}
    }
  },
  save(){localStorage.setItem('dtm_audio',JSON.stringify({sfxVol:this.sfxVol,musicVol:this.musicVol,muted:this.muted,musicMuted:this.musicMuted}));},
  load(){try{const d=JSON.parse(localStorage.getItem('dtm_audio')||'{}');this.sfxVol=d.sfxVol??0.6;this.musicVol=d.musicVol??0.4;this.muted=d.muted??false;this.musicMuted=d.musicMuted??false;}catch(e){}}
};
SFX.load();

const DTM = {
  W:390, H:844,
  API:'https://tiki-tan.com/deadwave/api.php',
  getName:()=>localStorage.getItem('dtm_playername')||'',
  setName:(n)=>localStorage.setItem('dtm_playername',n),
  getSnacks:()=>parseInt(localStorage.getItem('dtm_snacks')||'0'),
  addSnacks:(n)=>localStorage.setItem('dtm_snacks',String(DTM.getSnacks()+n)),
  spendSnacks:(n)=>localStorage.setItem('dtm_snacks',String(Math.max(0,DTM.getSnacks()-n))),
  getUpgrades:()=>JSON.parse(localStorage.getItem('dtm_upgrades')||'{"sneakers":0,"backpack":0,"phone":0,"hoodie":0}'),
  saveUpgrades:(u)=>localStorage.setItem('dtm_upgrades',JSON.stringify(u)),
  getUnlocked:()=>JSON.parse(localStorage.getItem('dtm_unlocked')||'[1,2,3]'),
  unlockLevel:(n)=>{const u=DTM.getUnlocked();if(!u.includes(n)){u.push(n);localStorage.setItem('dtm_unlocked',JSON.stringify(u));}},
  getStars:()=>JSON.parse(localStorage.getItem('dtm_stars')||'{}'),
  setStars:(lvl,s)=>{const st=DTM.getStars();st[lvl]=Math.max(st[lvl]||0,s);localStorage.setItem('dtm_stars',JSON.stringify(st));},
  getCurrentLevel:()=>parseInt(localStorage.getItem('dtm_currentlevel')||'1'),
  setCurrentLevel:(n)=>localStorage.setItem('dtm_currentlevel',String(n)),
  getToken:()=>localStorage.getItem('dtm_token')||'',
  setToken:(t)=>localStorage.setItem('dtm_token',t),
  getPlayer:()=>{try{return JSON.parse(localStorage.getItem('dtm_player')||'null');}catch(e){return null;}},
  setPlayer:(p)=>localStorage.setItem('dtm_player',JSON.stringify(p)),
  clearPlayer:()=>{localStorage.removeItem('dtm_player');localStorage.removeItem('dtm_token');},
  isLoggedIn:()=>!!localStorage.getItem('dtm_token')&&!!localStorage.getItem('dtm_player'),
  _fetch:async(url,opts={})=>{try{const c=new AbortController();const t=setTimeout(()=>c.abort(),10000);const r=await fetch(url,{...opts,signal:c.signal,headers:{...opts.headers,'Accept':'application/json'}});clearTimeout(t);if(!r.ok)return{error:`Server error: ${r.status}`};return await r.json();}catch(e){if(e.name==='AbortError')return{error:'Request timed out'};return{error:'Connection failed: '+e.message};}},
  register:async(username,password,display)=>DTM._fetch(DTM.API+'?action=register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,display})}),
  login:async(username,password)=>DTM._fetch(DTM.API+'?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})}),
  logout:async()=>{const t=DTM.getToken();if(t)try{await DTM._fetch(DTM.API+'?action=logout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t})});}catch(e){}DTM.clearPlayer();},
  validateSession:async()=>{const t=DTM.getToken();if(!t)return null;try{const d=await DTM._fetch(`${DTM.API}?action=validate&token=${t}`);if(d.success){DTM.setPlayer(d.player);const p=d.player;if(p.upgrades)localStorage.setItem('dtm_upgrades',typeof p.upgrades==='string'?p.upgrades:JSON.stringify(p.upgrades));if(p.unlocked_levels)localStorage.setItem('dtm_unlocked',typeof p.unlocked_levels==='string'?p.unlocked_levels:JSON.stringify(p.unlocked_levels));if(p.stars)localStorage.setItem('dtm_stars',typeof p.stars==='string'?p.stars:JSON.stringify(p.stars));if(p.total_snacks!=null)localStorage.setItem('dtm_snacks',String(p.total_snacks));return d.player;}}catch(e){}return null;},
  saveProgress:async()=>{const t=DTM.getToken();if(!t)return;try{await DTM._fetch(DTM.API+'?action=save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,total_snacks:DTM.getSnacks(),upgrades:DTM.getUpgrades(),unlocked_levels:DTM.getUnlocked(),stars:DTM.getStars(),highest_level:DTM.getCurrentLevel()})});}catch(e){}},
  locationForLevel:(n)=>{
    if(n<=10) return{name:'NORTHWOOD HIGH',color:'#4488ff'};
    if(n<=20) return{name:'MAIN ST ROASTERS',color:'#ff8800'};
    if(n<=30) return{name:'TIKI TAN',color:'#ff44aa'};
    if(n<=50) return{name:'THE STREETS',color:'#ffcc00'};
    return{name:"BRODY'S HOUSE",color:'#ff4444'};
  },
  enemiesForLevel:(n)=>{
    if(n<=10) return['ew'];
    if(n<=20) return['ew','ef'];
    if(n<=30) return['ew','ef','es'];
    if(n<=40) return['ew','ef','es','et'];
    if(n<=50) return['ew','ef','es','et','coach'];
    return['ew','ef','es','et','coach','sister'];
  },
  calcScore:(kills,rounds,timeLeft,stars,level)=>(kills*100)+(rounds*500)+(Math.floor(timeLeft/1000)*10)+(stars*1000)+(level*200),
  submitScore:async(name,score,level,kills,stars)=>DTM._fetch(DTM.API+'?action=submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,score,level,kills,stars})}),
  fetchLeaderboard:async(period='all')=>DTM._fetch(`${DTM.API}?action=leaderboard&period=${period}`),
  makeBG:(scene)=>{const g=scene.add.graphics();g.fillStyle(0x08080f);g.fillRect(0,0,W,H);g.lineStyle(1,0x1a1a2e,0.5);for(let x=0;x<W;x+=40)g.lineBetween(x,0,x,H);for(let y=0;y<H;y+=40)g.lineBetween(0,y,W,y);return g;},
  makeCard:(scene,x,y,w,h,alpha=1)=>{const g=scene.add.graphics();g.fillStyle(0x1a1a2e,alpha);g.fillRoundedRect(x,y,w,h,12);g.lineStyle(2,0xff9900,0.6);g.strokeRoundedRect(x,y,w,h,12);return g;},
  makeBtn:(scene,x,y,w,h,label,color=0xff9900)=>{
    const g=scene.add.graphics();g.fillStyle(color,1);g.fillRoundedRect(x,y,w,h,10);
    const t=scene.add.text(x+w/2,y+h/2,label,{fontFamily:'Orbitron',fontSize:'16px',color:'#000',fontStyle:'bold'}).setOrigin(0.5).setDepth(10);
    g.setInteractive(new Phaser.Geom.Rectangle(x,y,w,h),Phaser.Geom.Rectangle.Contains);
    g.on('pointerover',()=>g.setAlpha(0.8));g.on('pointerout',()=>g.setAlpha(1));
    return{bg:g,text:t};
  },
  bottomNav:(scene,active)=>{
    const tabs=[{key:'hub',icon:'\ud83c\udfe0',label:'HOME'},{key:'chapter',icon:'\u2b50',label:'NIGHTS'},{key:'leaderboard',icon:'\ud83c\udfc6',label:'RANKS'},{key:'upgrade',icon:'\ud83c\udf92',label:'LOCKER'}];
    const bg=scene.add.graphics().setDepth(99);bg.fillStyle(0x0d0d0d,0.97);bg.fillRect(0,H-80,W,80);bg.lineStyle(1,0xff9900,0.4);bg.lineBetween(0,H-80,W,H-80);
    tabs.forEach((tab,i)=>{
      const tx=i*(W/4)+W/8;const isA=tab.key===active;
      scene.add.text(tx,H-56,tab.icon,{fontSize:'22px'}).setOrigin(0.5).setDepth(100);
      scene.add.text(tx,H-30,tab.label,{fontFamily:'Orbitron',fontSize:'9px',color:isA?'#ff9900':'#666688'}).setOrigin(0.5).setDepth(100);
      if(isA){const ind=scene.add.graphics().setDepth(100);ind.fillStyle(0xff9900,1);ind.fillRect(tx-20,H-82,40,3);}
      const zone=scene.add.zone(tx,H-56,W/4,80).setDepth(101).setInteractive();
      zone.on('pointerdown',()=>{if(tab.key===active)return;scene.cameras.main.fadeOut(250,0,0,0);scene.time.delayedCall(250,()=>{const m={hub:'HubScene',chapter:'ChapterScene',leaderboard:'LeaderboardScene',upgrade:'UpgradeScene'};scene.scene.start(m[tab.key]);});});
    });
  }
};
DTM.MUSIC={current:null,_lastKey:'menu',
  tracks:{menu:'https://cdn.pixabay.com/audio/2022/10/25/audio_946b1e5fc4.mp3',game:'https://cdn.pixabay.com/audio/2023/03/11/audio_2e96f0b042.mp3',boss:'https://cdn.pixabay.com/audio/2022/03/24/audio_6e0f735d0b.mp3',victory:'https://cdn.pixabay.com/audio/2021/11/09/audio_3c2cde8c4b.mp3',gameover:'https://cdn.pixabay.com/audio/2022/03/15/audio_b75eb35d28.mp3'},
  play(key){this._lastKey=key;if(SFX.musicMuted)return;this.stop();const url=this.tracks[key];if(!url)return;this.current=new Audio(url);this.current.loop=true;this.current.volume=SFX.musicVol;this.current.play().catch(()=>{});},
  stop(){if(this.current){this.current.pause();this.current.currentTime=0;this.current=null;}},
  setVolume(v){SFX.musicVol=v;if(this.current)this.current.volume=v;SFX.save();},
  toggle(){SFX.musicMuted=!SFX.musicMuted;if(SFX.musicMuted)this.stop();else this.play(this._lastKey||'game');SFX.save();}
};

class AuthScene extends Phaser.Scene {
  constructor(){super('AuthScene');}
  async create(){
    DTM.makeBG(this);SFX.init();
    const checking=this.add.text(W/2,H/2,'Checking session...',{fontFamily:'Orbitron',fontSize:'14px',color:'#888899'}).setOrigin(0.5);
    const player=await DTM.validateSession();
    if(player){DTM.setName(player.display_name||player.username);this.cameras.main.fadeOut(300,0,0,0);this.time.delayedCall(300,()=>this.scene.start('HubScene'));return;}
    if(DTM.getName()){this.cameras.main.fadeOut(300,0,0,0);this.time.delayedCall(300,()=>this.scene.start('HubScene'));return;}
    checking.destroy();this._buildUI();
  }
  _buildUI(){
    DTM.makeBG(this);
    this.add.text(W/2,80,"DON'T TELL",{fontFamily:'Orbitron',fontSize:'32px',color:'#ff9900',fontStyle:'bold',stroke:'#000',strokeThickness:4}).setOrigin(0.5);
    this.add.text(W/2,122,'MAMA',{fontFamily:'Orbitron',fontSize:'52px',color:'#ffffff',fontStyle:'bold',stroke:'#ff9900',strokeThickness:3}).setOrigin(0.5);
    this.add.text(W/2,175,"Brody's Great Escape",{fontFamily:'Orbitron',fontSize:'13px',color:'#888899'}).setOrigin(0.5);
    let activeTab='login';const formObjs=[];
    const clearForm=()=>{formObjs.forEach(o=>{if(o&&o.destroy)o.destroy();else if(o&&o.remove)o.remove();});formObjs.length=0;document.querySelectorAll('.dtm-input').forEach(el=>el.remove());};
    const makeInput=(placeholder,yPos,type='text')=>{

// ─────────────────────────────────────────────────
// CHAPTER SCENE
// ─────────────────────────────────────────────────
class ChapterScene extends Phaser.Scene {
  constructor(){super('ChapterScene');}
  create(){
    DTM.makeBG(this);
    const unlocked=DTM.getUnlocked(),stars=DTM.getStars();
    const hg=this.add.graphics();hg.fillStyle(0x0d0d0d,0.95);hg.fillRect(0,0,W,60);hg.lineStyle(2,0xff9900,0.4);hg.lineBetween(0,60,W,60);
    this.add.text(W/2,30,'\ud83c\udf19 NIGHTS OUT',{fontFamily:'Orbitron',fontSize:'18px',color:'#ff9900',fontStyle:'bold'}).setOrigin(0.5);
    const back=this.add.text(16,30,'\u2039 BACK',{fontFamily:'Orbitron',fontSize:'13px',color:'#888899'}).setOrigin(0,0.5).setInteractive({useHandCursor:true});
    back.on('pointerdown',()=>{this.cameras.main.fadeOut(250,0,0,0);this.time.delayedCall(250,()=>this.scene.start('HubScene'));});
    const container=this.add.container(0,0);
    const sections=[
      {label:'\ud83d\udccd NORTHWOOD HIGH',color:'#4488ff',start:1,end:10},
      {label:'\ud83d\udccd MAIN ST ROASTERS',color:'#ff8800',start:11,end:20},
      {label:'\ud83d\udccd TIKI TAN',color:'#ff44aa',start:21,end:30},
      {label:'\ud83d\udccd THE STREETS',color:'#ffcc00',start:31,end:50},
      {label:"\ud83d\udccd BRODY'S HOUSE",color:'#ff4444',start:51,end:100},
    ];
    let yPos=75;
    sections.forEach(sec=>{
      container.add(this.add.text(20,yPos,sec.label,{fontFamily:'Orbitron',fontSize:'13px',color:sec.color,fontStyle:'bold'}).setDepth(5));
      yPos+=28;
      const cellSize=58,padding=8,cols=5;let col=0,rowY=yPos;
      for(let lvl=sec.start;lvl<=sec.end;lvl++){
        const cx=16+col*(cellSize+padding),cy=rowY,isU=unlocked.includes(lvl),lvlS=stars[lvl]||0,isSel=lvl===DTM.getCurrentLevel();
        const cell=this.add.graphics().setDepth(4);
        if(isSel){cell.fillStyle(0xff9900,0.3);cell.fillRoundedRect(cx,cy,cellSize,cellSize,8);cell.lineStyle(2,0xff9900,1);cell.strokeRoundedRect(cx,cy,cellSize,cellSize,8);}
        else if(isU){cell.fillStyle(0x1a1a2e,0.9);cell.fillRoundedRect(cx,cy,cellSize,cellSize,8);cell.lineStyle(1,0x333355,1);cell.strokeRoundedRect(cx,cy,cellSize,cellSize,8);}
        else{cell.fillStyle(0x0a0a0a,0.9);cell.fillRoundedRect(cx,cy,cellSize,cellSize,8);cell.lineStyle(1,0x222233,0.5);cell.strokeRoundedRect(cx,cy,cellSize,cellSize,8);}
        container.add(cell);
        if(isU){
          container.add(this.add.text(cx+cellSize/2,cy+18,String(lvl),{fontFamily:'Orbitron',fontSize:'14px',color:isSel?'#ff9900':'#ffffff',fontStyle:'bold'}).setOrigin(0.5).setDepth(5));
          if(lvlS>0)container.add(this.add.text(cx+cellSize/2,cy+38,'\u2b50'.repeat(lvlS),{fontSize:'10px'}).setOrigin(0.5).setDepth(5));
          const zone=this.add.zone(cx,cy,cellSize,cellSize).setOrigin(0,0).setDepth(6).setInteractive({useHandCursor:true});
          zone.on('pointerdown',()=>{DTM.setCurrentLevel(lvl);this.cameras.main.fadeOut(200,0,0,0);this.time.delayedCall(200,()=>this.scene.start('HubScene'));});
          container.add(zone);
        }else{container.add(this.add.text(cx+cellSize/2,cy+cellSize/2,'\ud83d\udd12',{fontSize:'18px'}).setOrigin(0.5).setDepth(5));}
        col++;if(col>=cols){col=0;rowY+=cellSize+padding;}
      }
      if(col>0)rowY+=cellSize+padding;
      yPos=rowY+16;
    });
    const totalH=yPos+100,maxScroll=Math.max(0,totalH-(H-140));
    let startY=0,containerY=0;
    this.input.on('pointerdown',p=>{startY=p.y;});
    this.input.on('pointermove',p=>{if(p.isDown){containerY=Phaser.Math.Clamp(containerY+(p.y-startY)*0.8,-maxScroll,0);container.setY(containerY);startY=p.y;}});
    DTM.bottomNav(this,'chapter');this.cameras.main.fadeIn(350,0,0,0);
  }
}

// ─────────────────────────────────────────────────
// LEADERBOARD SCENE
// ─────────────────────────────────────────────────
class LeaderboardScene extends Phaser.Scene {
  constructor(){super('LeaderboardScene');}
  create(){
    DTM.makeBG(this);
    const hg=this.add.graphics();hg.fillStyle(0x0d0d0d,0.95);hg.fillRect(0,0,W,60);hg.lineStyle(2,0xffcc00,0.4);hg.lineBetween(0,60,W,60);
    this.add.text(W/2,30,'\ud83c\udfc6 NORTHWOOD SNITCH LIST',{fontFamily:'Orbitron',fontSize:'15px',color:'#ffcc00',fontStyle:'bold'}).setOrigin(0.5);
    const back=this.add.text(16,30,'\u2039 BACK',{fontFamily:'Orbitron',fontSize:'13px',color:'#888899'}).setOrigin(0,0.5).setInteractive({useHandCursor:true});
    back.on('pointerdown',()=>{this.cameras.main.fadeOut(250,0,0,0);this.time.delayedCall(250,()=>this.scene.start('HubScene'));});
    const periods=['TODAY','WEEK','ALL TIME'],periodKeys=['today','week','all'];
    let activePeriod='all';const tabBtns=[];
    periods.forEach((p,i)=>{
      const tx=30+i*115;
      const tabBg=this.add.graphics();const tabTxt=this.add.text(tx+45,82,p,{fontFamily:'Orbitron',fontSize:'11px',color:activePeriod===periodKeys[i]?'#000':'#888899',fontStyle:'bold'}).setOrigin(0.5).setDepth(5);
      tabBtns.push({bg:tabBg,txt:tabTxt,key:periodKeys[i]});
      const drawTab=(act)=>{tabBg.clear();tabBg.fillStyle(act?0xffcc00:0x1a1a2e,1);tabBg.fillRoundedRect(tx,70,90,24,6);};
      drawTab(activePeriod===periodKeys[i]);
      const zone=this.add.zone(tx,70,90,24).setOrigin(0,0).setDepth(6).setInteractive({useHandCursor:true});
      zone.on('pointerdown',()=>{activePeriod=periodKeys[i];tabBtns.forEach((b,j)=>{const isAct=b.key===activePeriod;b.bg.clear();b.bg.fillStyle(isAct?0xffcc00:0x1a1a2e,1);b.bg.fillRoundedRect(30+j*115,70,90,24,6);b.txt.setColor(isAct?'#000':'#888899');});loadBoard(activePeriod);});
    });
    let listContainer=this.add.container(0,0);
    const loadingTxt=this.add.text(W/2,H/2,'\u23f3 Loading...',{fontFamily:'Orbitron',fontSize:'16px',color:'#888899'}).setOrigin(0.5);
    const loadBoard=async(period)=>{
      loadingTxt.setVisible(true);listContainer.destroy();listContainer=this.add.container(0,0);
      const data=await DTM.fetchLeaderboard(period);loadingTxt.setVisible(false);
      if(data.error){listContainer.add(this.add.text(W/2,H/2,"\ud83d\ude05 Couldn't reach\nthe Snitch List",{fontFamily:'Orbitron',fontSize:'14px',color:'#ff4444',align:'center'}).setOrigin(0.5));return;}
      const scores=data.scores||[];const myName=DTM.getName().toLowerCase();let myRank=-1;
      scores.forEach((s,i)=>{
        const y=105+i*54,isMe=s.player_name.toLowerCase()===myName;
        const rowBg=this.add.graphics();rowBg.fillStyle(isMe?0x2a1a00:i%2===0?0x0d0d1a:0x111122,1);rowBg.fillRoundedRect(12,y,W-24,48,6);
        if(isMe){rowBg.lineStyle(1,0xff9900,0.8);rowBg.strokeRoundedRect(12,y,W-24,48,6);myRank=i+1;}
        listContainer.add(rowBg);
        const rankColor=i===0?'#ffd700':i===1?'#c0c0c0':i===2?'#cd7f32':'#ffffff';
        listContainer.add(this.add.text(30,y+24,`#${i+1}`,{fontFamily:'Orbitron',fontSize:'14px',color:rankColor,fontStyle:'bold'}).setOrigin(0,0.5));
        listContainer.add(this.add.text(72,y+16,s.player_name.toUpperCase(),{fontFamily:'Orbitron',fontSize:'12px',color:isMe?'#ff9900':'#ffffff'}).setOrigin(0,0.5));
        listContainer.add(this.add.text(72,y+34,`Night ${s.level_reached}`,{fontFamily:'Orbitron',fontSize:'10px',color:'#666688'}).setOrigin(0,0.5));
        listContainer.add(this.add.text(W-24,y+24,s.score.toLocaleString(),{fontFamily:'Orbitron',fontSize:'14px',color:'#ff9900',fontStyle:'bold'}).setOrigin(1,0.5));
      });
      if(scores.length===0)listContainer.add(this.add.text(W/2,H/2,'No scores yet!\nBe the first on\nthe Snitch List! \ud83d\udc40',{fontFamily:'Orbitron',fontSize:'14px',color:'#888899',align:'center'}).setOrigin(0.5));
      if(myRank>0){
        const pinBg=this.add.graphics();pinBg.fillStyle(0x1a0d00,0.97);pinBg.fillRect(0,H-130,W,50);pinBg.lineStyle(1,0xff9900,0.5);pinBg.lineBetween(0,H-130,W,H-130);
        listContainer.add(pinBg);listContainer.add(this.add.text(W/2,H-105,`YOU: #${myRank} \u2022 ${DTM.getName().toUpperCase()}`,{fontFamily:'Orbitron',fontSize:'13px',color:'#ff9900',fontStyle:'bold'}).setOrigin(0.5));
      }
    };
    loadBoard('all');
    this.time.addEvent({delay:30000,callback:()=>loadBoard(activePeriod),loop:true});
    DTM.bottomNav(this,'leaderboard');this.cameras.main.fadeIn(350,0,0,0);
  }
}

class GameScene extends Phaser.Scene {
  constructor(){super('GameScene');}

    this.add.text(12,9,'HP',{fontFamily:'Orbitron',fontSize:'8px',color:'#ff9900'}).setDepth(D+2);
    this.add.graphics().setDepth(D).fillStyle(0x0d0d1a,0.92).fillRoundedRect(8,30,160,8,3).lineStyle(1,0xffdd00,0.4).strokeRoundedRect(8,30,160,8,3);
    this.xpBar=this.add.graphics().setDepth(D+1);
    this.lvlTxt=this.add.text(173,8,'LV 1',{fontFamily:'Orbitron',fontSize:'11px',color:'#ffdd00',fontStyle:'bold'}).setDepth(D+2);

    this.waveTxt=this.add.text(W/2,H/2-80,'',{fontFamily:'Orbitron',fontSize:'20px',color:'#ff6600',fontStyle:'bold',stroke:'#000',strokeThickness:5}).setDepth(D).setOrigin(0.5).setAlpha(0);
    this.multTxt=this.add.text(W-10,28,'',{fontFamily:'Orbitron',fontSize:'11px',color:'#ffcc00',fontStyle:'bold'}).setDepth(D).setOrigin(1,0);
    this.updateHP();this.updateXP();
  }

  setupInput(){this.cursors=this.input.keyboard.createCursorKeys();this.wasd=this.input.keyboard.addKeys('W,A,S,D');}

  setupJoystick(){
    this.jBase=this.add.graphics().setDepth(151).setAlpha(0);this.jThumb=this.add.graphics().setDepth(152).setAlpha(0);const R=60;
    this.input.on('pointerdown',p=>{if(p.x>W/2||this.paused||this.dead)return;this.joyActive=true;this.joyBaseX=p.x;this.joyBaseY=p.y;this.joyPointerId=p.id;this.jBase.setAlpha(0.35).clear().lineStyle(3,0xff9900).strokeCircle(p.x,p.y,R);this.jThumb.setAlpha(0.65).clear().fillStyle(0xff9900).fillCircle(p.x,p.y,22);});
    this.input.on('pointermove',p=>{if(!this.joyActive||p.id!==this.joyPointerId)return;const dx=p.x-this.joyBaseX,dy=p.y-this.joyBaseY,d=Math.hypot(dx,dy);this.joyAng=Math.atan2(dy,dx);this.joyDist=Math.min(d,R)/R;const tx=this.joyBaseX+Math.cos(this.joyAng)*Math.min(d,R),ty=this.joyBaseY+Math.sin(this.joyAng)*Math.min(d,R);this.jThumb.clear().fillStyle(0xff9900).fillCircle(tx,ty,22);});
    this.input.on('pointerup',p=>{if(p.id!==this.joyPointerId)return;this.joyActive=false;this.joyDist=0;this.jBase.setAlpha(0);this.jThumb.setAlpha(0);});
  }

  startRound(n){
    this.roundNum=n;this.roundActive=true;this.roundEnemies=[];
    const rd=this.activeRounds[n-1];
    if(!rd){this.winGame();return;}
    this.roundTxt.setText(`ROUND ${n}/${this.activeRounds.length}`);
    // Round intro card
    const ln=this.levelNum||1;const tier=ln<=10?1:ln<=30?2:3;
    const mainEnemy=rd.enemies[0].type;const ename=ENAMES[mainEnemy]||'???';
    if(mainEnemy==='boss'){SFX.play('boss');DTM.MUSIC.play('boss');}else if(mainEnemy==='sister')SFX.play('boss');
    const tierColors={1:'#888888',2:'#4488ff',3:'#aa44ff'};
    const tierNames={1:'TIER 1',2:'TIER 2',3:'TIER 3'};
    const tq=(TIER_QUOTES[mainEnemy]||['','',''])[tier-1]||rd.quote||'';
    const ov=this.add.graphics().setDepth(200);ov.fillStyle(0x000000,0.85);ov.fillRect(0,0,W,H);
    const card=this.add.graphics().setDepth(201);card.fillStyle(0x1a1a2e,0.97);card.fillRoundedRect(40,H/2-100,W-80,200,14);card.lineStyle(2,0xff9900,0.7);card.strokeRoundedRect(40,H/2-100,W-80,200,14);
    const rt=this.add.text(W/2,H/2-75,`ROUND ${n}`,{fontFamily:'Orbitron',fontSize:'14px',color:'#ff9900'}).setDepth(202).setOrigin(0.5);
    const sep=this.add.graphics().setDepth(202);sep.lineStyle(1,0x333355);sep.lineBetween(60,H/2-55,W-60,H/2-55);
    const en=this.add.text(W/2,H/2-25,ename,{fontFamily:'Orbitron',fontSize:'22px',color:'#ffffff',fontStyle:'bold'}).setDepth(202).setOrigin(0.5);
    const qt=this.add.text(W/2,H/2+10,`"${tq}"`,{fontFamily:'Orbitron',fontSize:'10px',color:'#888899',fontStyle:'italic'}).setDepth(202).setOrigin(0.5);
    const ti=this.add.text(W/2,H/2+50,tierNames[tier],{fontFamily:'Orbitron',fontSize:'12px',color:tierColors[tier],fontStyle:'bold'}).setDepth(202).setOrigin(0.5);
    const tierDotG=this.add.graphics().setDepth(202);tierDotG.fillStyle({1:0x888888,2:0x4488ff,3:0xaa44ff}[tier],1);tierDotG.fillCircle(W/2-ti.width/2-14,H/2+50,6);
    this.time.delayedCall(2000,()=>{[ov,card,rt,sep,en,qt,ti,tierDotG].forEach(o=>o.destroy());
      this.roundStartTime=this.elapsed;this.roundMinTimeMet=false;this._respawnScheduled=false;
      this.waveTxt.setText(rd.label).setAlpha(1).setY(H/2-80);
      this.tweens.add({targets:this.waveTxt,alpha:0,y:H/2-130,duration:2500,ease:'Power2'});
      let idx=0;
      rd.enemies.forEach(grp=>{for(let i=0;i<grp.count;i++){this.time.delayedCall(idx*1500,()=>{if(this.dead)return;const e=this.spawnEnemy(grp.type);if(e)this.roundEnemies.push(e);});idx++;}});
    });
  }

  checkRoundClear(){
    if(!this.roundActive||this.dead)return;
    const alive=this.roundEnemies.filter(e=>e&&!e.dead);
    if(alive.length>0)return;
    // Minimum round timer — if enemies died too fast, respawn
    if(!this.roundMinTimeMet&&this.roundStartTime>0){
      const rElapsed=this.elapsed-this.roundStartTime;
      const remaining=Math.ceil((BALANCE.minRoundTime-rElapsed)/1000);
      if(!this._surviveText){
        this._surviveText=this.add.text(W/2,H/2+40,'',{fontFamily:'Orbitron',fontSize:'14px',color:'#ff9900',stroke:'#000',strokeThickness:3}).setDepth(150).setOrigin(0.5);
      }
      this._surviveText.setText(`SURVIVING... ${remaining}s`);
      // Respawn after 3s delay
      if(!this._respawnScheduled){
        this._respawnScheduled=true;
        const rd=this.activeRounds[this.roundNum-1];
        if(rd){this.time.delayedCall(3000,()=>{
          if(this.dead||this.roundMinTimeMet)return;
          rd.enemies.forEach(grp=>{for(let i=0;i<grp.count;i++){const e=this.spawnEnemy(grp.type);if(e)this.roundEnemies.push(e);}});
          this._respawnScheduled=false;
        });}
      }
      return;
    }
    if(this._surviveText){this._surviveText.destroy();this._surviveText=null;}
    this._respawnScheduled=false;
    this.roundActive=false;this.roundsCompleted++;
    const lk=this._lastKillPos||{x:W/2,y:H/2};
    for(let i=0;i<8;i++){const gx=lk.x+Phaser.Math.Between(-40,40),gy=lk.y+Phaser.Math.Between(-40,40);const gem=this.gems.create(gx,gy,'gem').setDepth(5).setDisplaySize(20,20);gem.xp=1;this.tweens.add({targets:gem,y:gy-22,duration:220,yoyo:true,ease:'Bounce'});}
    SFX.play('roundclear');
    this.cameras.main.flash(200,0,255,100);
    this.physics.world.timeScale=3;this.time.delayedCall(400,()=>{this.physics.world.timeScale=1;});
    const ct=this.add.text(W/2,H/2,'\u2713 ROUND CLEAR!',{fontFamily:'Orbitron',fontSize:'26px',color:'#00ff88',fontStyle:'bold',stroke:'#000',strokeThickness:6}).setDepth(201).setOrigin(0.5);
    this.time.delayedCall(2500,()=>{ct.destroy();this.startRound(this.roundNum+1);});
  }

  randEdge(){const s=Phaser.Math.Between(0,3);switch(s){case 0:return{x:Phaser.Math.Between(0,W),y:-40};case 1:return{x:W+40,y:Phaser.Math.Between(0,H)};case 2:return{x:Phaser.Math.Between(0,W),y:H+40};case 3:return{x:-40,y:Phaser.Math.Between(0,H)};}}

  getEnemyStats(type){
    const d=this.diffScale,ss=this.enemySpdScale;
    const s={ew:{hp:Math.floor(280*d),spd:Math.floor(38*ss),dmg:12,gd:2,sv:50,bc:0xaaaaaa},ef:{hp:Math.floor(200*d),spd:Math.floor(88*ss),dmg:10,gd:2,sv:60,bc:0xff8800},es:{hp:Math.floor(340*d),spd:Math.floor(55*ss),dmg:14,gd:3,sv:80,bc:0x4444ff},et:{hp:Math.floor(600*d),spd:Math.floor(28*ss),dmg:25,gd:5,sv:150,bc:0xff0000},coach:{hp:Math.floor(420*d),spd:Math.floor(72*ss),dmg:16,gd:4,sv:120,bc:0x4488ff},sister:{hp:Math.floor(500*d),spd:Math.floor(68*ss),dmg:14,gd:6,sv:200,bc:0xcc44ff},boss:{hp:Math.floor(1200*d),spd:Math.floor(52*ss),dmg:30,gd:15,sv:500,bc:0xff6600}};
    return s[type]||s.ew;
  }

  spawnEnemy(tex){
    const{x,y}=this.randEdge();
    const e=this.enemies.create(x,y,tex==='sister'?'sister':tex==='boss'?'boss':tex).setDepth(6);
    e.uid=++this.uidCounter;e.dead=false;e.invincible=false;e.etype=tex;
    e.isMinion=false;e.isBoss=tex==='boss';e.isPeyton=tex==='sister';
    e.isCharging=false;e.chargeDmg=0;
    e.abilityTimer=0;e.abilityTimer2=0;e.abilityTimer3=0;
    e.spawnedMinions=0;e.patrolTarget=null;
    const ln=this.levelNum||1;
    e.tier=ln<=10?1:ln<=30?2:3;
    const st=this.getEnemyStats(tex);
    e.hp=st.hp;e.maxHp=st.hp;e.spd=st.spd;e.dmg=st.dmg;e.gd=st.gd;e.sv=st.sv;e.burstColor=st.bc;
    switch(tex){
      case 'ew':e.setDisplaySize(100,100);break;
      case 'ef':e.setDisplaySize(95,95);e.play('karen_walk');break;
      case 'es':e.setDisplaySize(95,95);e.play('steiner_walk');e.patrolTarget={x:Phaser.Math.Between(60,W-60),y:Phaser.Math.Between(100,H-100)};break;
      case 'et':e.setDisplaySize(120,120);e.chargeDmg=50;break;
      case 'coach':e.setDisplaySize(108,108);e.play('coach_run');e.lastWhistle=0;e.lastDrill=0;break;

    const m=Math.floor(rem/60000),s=Math.floor((rem%60000)/1000);
    this.timerTxt.setText(`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`);
    if(rem<120000)this.timerTxt.setColor('#ff4444');
    if(rem<=0){this.winGame();return;}
    if(this.playerIframes>0)this.playerIframes-=delta;
    this.playerLabel.setPosition(this.player.x,this.player.y-this.player.displayHeight/2-4);
    // Minimum round timer
    if(this.roundActive&&this.roundStartTime>0){
      const rElapsed=this.elapsed-this.roundStartTime;
      if(rElapsed<BALANCE.minRoundTime)this.roundMinTimeMet=false;else this.roundMinTimeMet=true;
      // In-round difficulty ramp
      if(rElapsed>=15000&&rElapsed<15000+delta)this.enemies.getChildren().forEach(en=>{if(!en.dead&&!en.isMinion){en.spd=Math.floor(en.spd*1.2);}});

    }
    // Enemy HP regen (2% max per second)

    if(this.playerFrozen){this.player.setVelocity(0,0);}else if(this.forcedRun){}else{this.movePlayer();}
    this.autoShoot(time);
    if(this.orbitCnt>0)this.updateOrbits(delta);
    this.updateEnemyAI(time,delta);
    this.updateProjectiles(delta);
    this.updateBossOrbs(delta);
    this.updateGlow();
    this.cleanBullets();

    const ic=this.add.graphics().setDepth(205);ic.fillStyle(0x0d0d1a,0.95);ic.fillRoundedRect(W/2-140,H/2-80,280,140,12);ic.lineStyle(2,0xff9900,1);ic.strokeRoundedRect(W/2-140,H/2-80,280,140,12);
    const nt=this.add.text(W/2,H/2-58,'\u26a0 NEW SNITCH!',{fontFamily:'Orbitron',fontSize:'13px',color:'#ff9900'}).setOrigin(0.5).setDepth(206);
    const nm=this.add.text(W/2,H/2-28,nameMap[type]||'???',{fontFamily:'Orbitron',fontSize:'20px',color:'#ffffff',fontStyle:'bold'}).setOrigin(0.5).setDepth(206);
    const qt=this.add.text(W/2,H/2+8,quoteMap[type]||'',{fontFamily:'Orbitron',fontSize:'11px',color:'#888899',fontStyle:'italic'}).setOrigin(0.5).setDepth(206);
    const ht=this.add.text(W/2,H/2+38,'\u2b07 30% HP \u2014 first encounter bonus',{fontFamily:'Orbitron',fontSize:'9px',color:'#00ff88'}).setOrigin(0.5).setDepth(206);
    this.time.delayedCall(2500,()=>[ic,nt,nm,qt,ht].forEach(o=>this.tweens.add({targets:o,alpha:0,duration:400,onComplete:()=>o.destroy()})));
  }

  togglePause(){
    if(this.dead)return;this.paused=!this.paused;SFX.play('pause');
    if(this.paused){this.physics.pause();this.showPauseMenu();}else{this.physics.resume();this.hidePauseMenu();}
  }

  showPauseMenu(){
    this._pauseObjs=[];const add=(o)=>{this._pauseObjs.push(o);return o;};
    const ov=add(this.add.graphics().setDepth(200));ov.fillStyle(0x000000,0.85);ov.fillRect(0,0,W,H);
    add(DTM.makeCard(this,40,200,W-80,420,0.98));
    add(this.add.text(W/2,230,'\u23f8 PAUSED',{fontFamily:'Orbitron',fontSize:'26px',color:'#ff9900',fontStyle:'bold'}).setOrigin(0.5).setDepth(201));
    // Music volume
    add(this.add.text(60,290,'\ud83c\udfb5 MUSIC',{fontFamily:'Orbitron',fontSize:'13px',color:'#ffffff'}).setDepth(201));
    const mmBtn=add(this.add.text(W-55,290,SFX.musicMuted?'\ud83d\udd07':'\ud83d\udd0a',{fontSize:'20px'}).setDepth(201).setInteractive({useHandCursor:true}));
    const msBg=add(this.add.graphics().setDepth(201)),msFill=add(this.add.graphics().setDepth(202));
    this.drawVolumeSlider('music',msBg,msFill);
    mmBtn.on('pointerdown',()=>{DTM.MUSIC.toggle();mmBtn.setText(SFX.musicMuted?'\ud83d\udd07':'\ud83d\udd0a');this.drawVolumeSlider('music',msBg,msFill);});
    const mZone=add(this.add.zone(60,318,W-120,20).setOrigin(0,0).setDepth(203).setInteractive());
    const mDrag=(p)=>{const pct=Phaser.Math.Clamp((p.x-60)/(W-120),0,1);DTM.MUSIC.setVolume(pct);this.drawVolumeSlider('music',msBg,msFill);};
    mZone.on('pointerdown',mDrag);mZone.on('pointermove',(p)=>{if(p.isDown)mDrag(p);});
    // SFX volume
    add(this.add.text(60,360,'\ud83d\udd0a SOUNDS',{fontFamily:'Orbitron',fontSize:'13px',color:'#ffffff'}).setDepth(201));
    const smBtn=add(this.add.text(W-55,360,SFX.muted?'\ud83d\udd07':'\ud83d\udd0a',{fontSize:'20px'}).setDepth(201).setInteractive({useHandCursor:true}));
    const ssBg=add(this.add.graphics().setDepth(201)),ssFill=add(this.add.graphics().setDepth(202));
    this.drawVolumeSlider('sfx',ssBg,ssFill);
    smBtn.on('pointerdown',()=>{SFX.muted=!SFX.muted;SFX.save();smBtn.setText(SFX.muted?'\ud83d\udd07':'\ud83d\udd0a');this.drawVolumeSlider('sfx',ssBg,ssFill);});
    const sZone=add(this.add.zone(60,388,W-120,20).setOrigin(0,0).setDepth(203).setInteractive());
    const sDrag=(p)=>{const pct=Phaser.Math.Clamp((p.x-60)/(W-120),0,1);SFX.sfxVol=pct;SFX.save();this.drawVolumeSlider('sfx',ssBg,ssFill);};
    sZone.on('pointerdown',sDrag);sZone.on('pointermove',(p)=>{if(p.isDown)sDrag(p);});
    // Buttons
    const rb=DTM.makeBtn(this,50,440,W-100,52,'\u25b6 RESUME',0x00aa44);rb.bg.setDepth(201);rb.text.setDepth(202);this._pauseObjs.push(rb.bg,rb.text);rb.bg.on('pointerdown',()=>this.togglePause());
    const qb=DTM.makeBtn(this,50,504,W-100,52,'\ud83c\udfe0 QUIT TO HUB',0x1a1a2e);qb.bg.setDepth(201);qb.text.setDepth(202);qb.text.setColor('#ff9900');this._pauseObjs.push(qb.bg,qb.text);qb.bg.on('pointerdown',()=>{DTM.MUSIC.stop();this.scene.start('HubScene');});
    add(this.add.text(W/2,576,'Music: Pixabay CC0 | SFX: Generated',{fontFamily:'Orbitron',fontSize:'9px',color:'#444466'}).setOrigin(0.5).setDepth(201));
  }

  drawVolumeSlider(type,bgG,fillG){
    const y=type==='music'?318:388,val=type==='music'?SFX.musicVol:SFX.sfxVol,mt=type==='music'?SFX.musicMuted:SFX.muted,w=W-120;
    bgG.clear();bgG.fillStyle(0x333355,1);bgG.fillRoundedRect(60,y+4,w,12,6);
    fillG.clear();fillG.fillStyle(mt?0x444444:0xff9900,1);fillG.fillRoundedRect(60,y+4,Math.floor(w*val),12,6);
    fillG.fillStyle(0xffffff,1);fillG.fillCircle(60+Math.floor(w*val),y+10,9);
  }

  hidePauseMenu(){if(this._pauseObjs){this._pauseObjs.forEach(o=>{if(o&&o.destroy)o.destroy();});this._pauseObjs=[];}}
}

// ─────────────────────────────────────────────────
// RESULT SCENE (replaces EndScene)
// ─────────────────────────────────────────────────
class ResultScene extends Phaser.Scene {
  constructor(){super('ResultScene');}
  init(d){this.d=d;}
  async create(){
    DTM.makeBG(this);
    const{win,kills,level,elapsed,rounds,snacksEarned,specialHits,finalHP,maxHP}=this.d;
    const timeLeft=Math.max(0,15*60*1000-elapsed);
    const stars=win?(specialHits===0?3:(finalHP>maxHP*0.5?2:1)):0;
    const score=DTM.calcScore(kills,rounds||0,timeLeft,stars,level);
    if(win){DTM.setStars(level,stars);DTM.unlockLevel(level+1);DTM.addSnacks(snacksEarned||0);const hs=parseInt(localStorage.getItem('dw_hs')||'0');if(kills>hs)localStorage.setItem('dw_hs',kills);}
    const headerColor=win?'#00ff88':'#ff2244';
    const headerText=win?'\ud83c\udf19 NIGHT COMPLETE!':'\ud83d\udc80 MAMA CAUGHT YOU!';
    this.add.text(W/2,80,headerText,{fontFamily:'Orbitron',fontSize:'22px',fontStyle:'bold',color:headerColor,stroke:'#000',strokeThickness:5,wordWrap:{width:320}}).setOrigin(0.5);
    if(win){for(let i=0;i<3;i++){const s=this.add.text(W/2-40+i*40,140,i<stars?'\u2b50':'\u2606',{fontSize:'28px'}).setOrigin(0.5).setAlpha(0);this.time.delayedCall(300+i*200,()=>this.tweens.add({targets:s,alpha:1,scaleX:1.3,scaleY:1.3,duration:300,yoyo:true}));}}
    DTM.makeCard(this,24,185,W-48,220,0.95);
    const rows=[['SNITCHES CAUGHT',kills],['ROUNDS SURVIVED',rounds||0],['SNACKS COLLECTED',snacksEarned||0],['SCORE',score.toLocaleString()]];
    rows.forEach(([label,val],i)=>{const y=210+i*48;this.add.text(40,y,label,{fontFamily:'Orbitron',fontSize:'11px',color:'#888899'});this.add.text(W-40,y,String(val),{fontFamily:'Orbitron',fontSize:'18px',color:'#ffffff',fontStyle:'bold'}).setOrigin(1,0);if(i<rows.length-1){const lg=this.add.graphics();lg.lineStyle(1,0x1e1e3a);lg.lineBetween(40,y+30,W-40,y+30);}});
    if(win&&snacksEarned>0)this.add.text(W/2,418,`+${snacksEarned} \ud83c\udf55 SNACKS EARNED`,{fontFamily:'Orbitron',fontSize:'13px',color:'#ffcc00',fontStyle:'bold'}).setOrigin(0.5);
    const rankTxt=this.add.text(W/2,450,'\u23f3 Submitting score...',{fontFamily:'Orbitron',fontSize:'12px',color:'#888899'}).setOrigin(0.5);
    const result=await DTM.submitScore(DTM.getName(),score,level,kills,stars);
    if(result.rank)rankTxt.setText(`\ud83c\udfc6 YOUR RANK: #${result.rank} on the Snitch List!`).setColor('#ffcc00');
    else rankTxt.setText('\ud83d\udce1 Score saved locally').setColor('#888899');
    const retryBtn=DTM.makeBtn(this,20,510,(W-52)/2,56,'\u21ba RETRY');
    retryBtn.bg.on('pointerdown',()=>{this.cameras.main.fadeOut(250,0,0,0);this.time.delayedCall(250,()=>this.scene.start('GameScene',{level:level}));});
    const hubBtn=DTM.makeBtn(this,W/2+6,510,(W-52)/2,56,'\ud83c\udfe0 HOME',0x1a1a2e);
    hubBtn.text.setColor('#ff9900');hubBtn.bg.on('pointerdown',()=>{this.cameras.main.fadeOut(250,0,0,0);this.time.delayedCall(250,()=>this.scene.start('HubScene'));});
    if(win){const nextBtn=DTM.makeBtn(this,20,578,W-40,52,`NEXT NIGHT ${level+1} \u203a`,0x00aa44);nextBtn.bg.on('pointerdown',()=>{DTM.setCurrentLevel(level+1);this.cameras.main.fadeOut(250,0,0,0);this.time.delayedCall(250,()=>this.scene.start('GameScene',{level:level+1}));});}
    if(!win){const lc=parseInt(localStorage.getItem(`dtm_losses_${level}`)||'0');if(lc>=1)this.add.text(W/2,580,'\ud83d\udca1 Tip: Upgrade your gear\nin the Locker!',{fontFamily:'Orbitron',fontSize:'11px',color:'#888899',align:'center'}).setOrigin(0.5);if(lc>=2)this.add.text(W/2,616,'\ud83d\udcaa Comeback buff active next try!',{fontFamily:'Orbitron',fontSize:'10px',color:'#00ff88'}).setOrigin(0.5);}
    this.cameras.main.fadeIn(400,0,0,0);
  }
}

// ─────────────────────────────────────────────────
// WHITE BACKGROUND REMOVAL & LAUNCH
// ─────────────────────────────────────────────────
async function stripWhiteBGs(){
  const files=['gary.png','mrberg.png','thekid.png','karen.png','steiner.png','mama.png','sister.png','footballcoach.png','bullet.png','shard.png'];
  for(const file of files){
    try{const blob=await fetch(file).then(r=>r.blob());const url=URL.createObjectURL(blob);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);const d=ctx.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4){if(d.data[i]>230&&d.data[i+1]>230&&d.data[i+2]>230)d.data[i+3]=0;}ctx.putImageData(d,0,0);const cleanBlob=await new Promise(res=>c.toBlob(res));window.__cleanURLs=window.__cleanURLs||{};window.__cleanURLs[file]=URL.createObjectURL(cleanBlob);}catch(e){console.warn('Could not strip',file,e);}
  }
}

stripWhiteBGs().then(()=>{
  new Phaser.Game({
    type:Phaser.AUTO,width:W,height:H,backgroundColor:'#07070f',dom:{createContainer:true},
    physics:{default:'arcade',arcade:{debug:false,gravity:{y:0}}},
    scene:[MenuScene,AuthScene,HubScene,ChapterScene,GameScene,ResultScene,LeaderboardScene,UpgradeScene],
    scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH,width:W,height:H,expandParent:true},
    parent:document.body,
  });
});
